<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Searchable KB</title>
  <style>
    :root { --ink: #1c1f24; --muted: #5d6470; --line: #dfe2e7; --accent: #2356c7; --bg: #f7f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .sub { margin: 0 0 24px; color: var(--muted); }
    form { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; }
    button { padding: 0 18px; font-size: 15px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    .examples { margin: 12px 0 28px; color: var(--muted); font-size: 13px; }
    .examples a { color: var(--accent); margin-right: 10px; cursor: pointer; }
    .status { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .result { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }
    .result h2 { margin: 0; font-size: 17px; }
    .meta { font-size: 12px; color: var(--muted); margin: 4px 0 10px; }
    .score { font-variant-numeric: tabular-nums; }
    details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
    pre { white-space: pre-wrap; font: inherit; margin: 10px 0 0; }
    .error { color: #b3261e; }
  </style>
</head>
<body>
  <main>
    <h1>Searchable KB</h1>
    <p class="sub">Describe the problem in your own words. Results are ranked by meaning, not keyword overlap.</p>
    <form id="search">
      <input id="q" name="q" placeholder="e.g. got a new phone and can't approve sign-ins" autocomplete="off" autofocus>
      <button type="submit">Search</button>
    </form>
    <div class="examples">Try:
      <a>weird number screen when my laptop starts</a>
      <a>nothing comes out of the printer</a>
      <a>I clicked a sketchy link</a>
    </div>
    <div class="status" id="status"></div>
    <div id="results"></div>
  </main>
  <script>
    const form = document.getElementById("search");
    const input = document.getElementById("q");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    document.querySelectorAll(".examples a").forEach((a) =>
      a.addEventListener("click", () => { input.value = a.textContent; form.requestSubmit(); })
    );

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const q = input.value.trim();
      if (q.length < 2) return;
      status.className = "status";
      status.textContent = "Searching…";
      results.replaceChildren();
      try {
        const res = await fetch(`api/search?q=${encodeURIComponent(q)}&k=3`);
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Search failed");
        status.textContent = `${data.results.length} results in ${data.took_ms} ms`;
        data.results.forEach((r) => results.appendChild(renderResult(r)));
      } catch (err) {
        status.className = "status error";
        status.textContent = err.message;
      }
    });

    function renderResult(r) {
      const card = el("div", "result");
      card.appendChild(el("h2", "", r.title));
      const meta = el("div", "meta");
      meta.append(el("span", "score", `similarity ${r.score.toFixed(2)}`), ` · ${r.tags.join(", ")} · ${r.source}`);
      card.appendChild(meta);
      const details = el("details");
      details.appendChild(el("summary", "", "Show entry"));
      details.appendChild(el("pre", "", r.body));
      card.appendChild(details);
      return card;
    }

    function el(tag, className = "", text = "") {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }
  </script>
</body>
</html>
